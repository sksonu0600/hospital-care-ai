[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caregraph-hospital-ai"
version = "0.1.0"
description = "Educational LangGraph hospital decision-support POC without RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "langchain-openai>=1.7.2",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
